
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 40px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        p {
            font-weight: bold;
            color: #333;
            text-align: center;
        }
        ul {
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            width: 400px;
            margin: 20px auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h2>Sistema de Cadastro de Alunos</h2>
    <form method="POST">
        <label>Nome Completo:</label>
        <input type="text" name="nome">

        <label>E-mail:</label>
        <input type="email" name="email">

        <label>Telefone:</label>
        <input type="text" name="telefone">

        <label>CPF:</label>
        <input type="text" name="cpf">

        <label>Cidade:</label>
        <input type="text" name="cidade">

        <label>Estado:</label>
        <input type="text" name="estado">

        <label>Curso:</label>
        <input type="text" name="curso">  

        <label>Idade:</label>
        <input type="text" name="idade">

        <label>Senha:</label>
        <input type="password" name="senha">

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
