<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 8px 16px; }
        .erro { color: red; margin-top: 10px; }
        nav { margin-bottom: 20px; }
    </style>
</head>
<body>

    <nav>
        <a href="{{ url_for('cadastro') }}">Cadastrar</a> |
        <a href="{{ url_for('listar') }}">Listar Livros</a> |
        <a href="{{ url_for('buscar') }}">Buscar</a>
    </nav>

    <h1>Cadastro de Livro</h1>

    {% if erro %}
        <p class="erro">{{ erro }}</p>

    <form method="POST">
        <label for="titulo">Título</label>
        <input type="text" name="titulo" id="titulo">

        <label for="autor">Autor</label>
        <input type="text" name="autor" id="autor">

        <label for="ano">Ano de publicação</label>
        <input type="text" name="ano" id="ano">

        <label for="categoria">Categoria</label>
        <input type="text" name="categoria" id="categoria">

        <label for="quantidade">Quantidade de exemplares</label>
        <input type="text" name="quantidade" id="quantidade">

        <button type="submit">Cadastrar Livro</button>
    </form>

</body>
</html>
