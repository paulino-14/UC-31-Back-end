<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquete ao Vivo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 540px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  .nav { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .nav-btn { flex: 1; padding: 9px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; color: #555; transition: all .15s; }
  .nav-btn:hover { background: #f0f0f0; }
  .nav-btn.active { background: #eee; color: #111; border-color: #bbb; font-weight: 500; }
  .page { display: none; }
  .page.active { display: block; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 12px; }
  .opcao-btn { width: 100%; display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; cursor: pointer; font-size: 15px; color: #111; text-align: left; transition: background .15s; margin-bottom: 10px; }
  .opcao-btn:hover { background: #f5f5f5; }
  .opcao-btn:active { transform: scale(0.98); }
  .opcao-btn .emoji { font-size: 20px; }
  .opcao-btn .label { flex: 1; }
  .barra-wrap { background: #eee; border-radius: 99px; height: 10px; overflow: hidden; margin: 6px 0 2px; }
  .barra { height: 100%; border-radius: 99px; transition: width .6s ease; }
  .b1 { background: #534AB7; }
  .b2 { background: #1D9E75; }
  .b3 { background: #D85A30; }
  .res-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .res-emoji { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
  .res-info { flex: 1; }
  .res-nome { font-size: 14px; font-weight: 500; }
  .res-count { font-size: 12px; color: #888; }
  .res-pct { font-size: 18px; font-weight: 600; min-width: 46px; text-align: right; }
  .alerta { padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
  .alerta.ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .alerta.err { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; }
  .votado-badge { background: #e3f2fd; color: #1565c0; border-radius: 99px; font-size: 11px; padding: 2px 8px; margin-left: 8px; }
  .total-badge { display: inline-flex; align-items: center; gap: 6px; background: #eee; border-radius: 99px; padding: 5px 14px; font-size: 13px; color: #555; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Enquete ao Vivo</h1>
  <p class="sub">Qual é a melhor linguagem para aprender primeiro?</p>

  <div class="nav">
    <button class="nav-btn active" onclick="ir('home')">🏠 Início</button>
    <button class="nav-btn" onclick="ir('votar')">👍 Votar</button>
    <button class="nav-btn" onclick="ir('resultado')">📈 Resultado</button>
  </div>

  <!-- PÁGINA HOME -->
  <div id="pg-home" class="page active">
    <div class="card">
      <p style="font-size:14px;color:#666;margin-bottom:12px">Veja os votos atuais ou vá em <strong>Votar</strong> para participar.</p>
      <div id="home-resumo"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="opcao-btn" style="justify-content:center" onclick="ir('votar')">👍 Votar agora</button>
      <button class="opcao-btn" style="justify-content:center" onclick="ir('resultado')">📈 Ver resultado</button>
    </div>
  </div>

  <!-- PÁGINA VOTAR -->
  <div id="pg-votar" class="page">
    <p class="sub" id="sub-votar">Escolha a sua opção. Apenas um voto por visitante.</p>
    <div id="alerta-voto"></div>
    <div id="lista-opcoes"></div>
  </div>

  <!-- PÁGINA RESULTADO -->
  <div id="pg-resultado" class="page">
    <div class="card" id="resultado-card"></div>
    <span class="total-badge" id="total-badge">👥 — votos</span>
  </div>
</div>

<script>
  /* -------- dados das opções -------- */
  const OPCOES = [
    { id: 'python',     emoji: '🐍', label: 'Python'      },
    { id: 'javascript', emoji: '🌐', label: 'JavaScript'  },
    { id: 'c',          emoji: '⚙️', label: 'C / C++'     }
  ];
  const CORES = ['b1', 'b2', 'b3'];

  /* -------- votos em memória (troque por fetch/API para persistir) -------- */
  let votos = { python: 0, javascript: 0, c: 0 };

  /* -------- cookie -------- */
  function getCookie(nome) {
    return document.cookie.split(';')
      .map(c => c.trim())
      .find(c => c.startsWith(nome + '='))
      ?.split('=')[1] || null;
  }
  function setCookie(nome, valor) {
    const d = new Date();
    d.setFullYear(d.getFullYear() + 1);
    document.cookie = `${nome}=${valor};expires=${d.toUTCString()};path=/`;
  }

  /* -------- helpers -------- */
  function total() { return Object.values(votos).reduce((a, b) => a + b, 0); }
  function pct(id)  { const t = total(); return t ? Math.round(votos[id] / t * 100) : 0; }

  /* -------- renders -------- */
  function renderHome() {
    document.getElementById('home-resumo').innerHTML = OPCOES.map((o, i) => `
      <div class="res-row">
        <span class="res-emoji">${o.emoji}</span>
        <div class="res-info">
          <div class="res-nome">${o.label}</div>
          <div class="barra-wrap"><div class="barra ${CORES[i]}" style="width:${pct(o.id)}%"></div></div>
        </div>
        <span class="res-pct">${pct(o.id)}%</span>
      </div>`).join('');
  }

  function renderVotar() {
    const meuVoto = getCookie('meu_voto');
    document.getElementById('sub-votar').textContent = meuVoto
      ? 'Você já votou nesta enquete.'
      : 'Escolha a sua opção. Apenas um voto por visitante.';

    document.getElementById('alerta-voto').innerHTML = meuVoto
      ? `<div class="alerta ok">✅ Voto registrado em <strong>${OPCOES.find(o => o.id === meuVoto)?.label}</strong>. Obrigado!</div>`
      : '';

    if (meuVoto) {
      document.getElementById('lista-opcoes').innerHTML = OPCOES.map((o, i) => `
        <div class="card" style="display:flex;align-items:center;gap:10px;opacity:${o.id === meuVoto ? 1 : 0.5}">
          <span style="font-size:20px">${o.emoji}</span>
          <span style="flex:1">${o.label}${o.id === meuVoto ? '<span class="votado-badge">seu voto</span>' : ''}</span>
          <span style="font-size:13px;color:#888">${votos[o.id]} voto${votos[o.id] !== 1 ? 's' : ''}</span>
        </div>`).join('');
    } else {
      document.getElementById('lista-opcoes').innerHTML = OPCOES.map(o => `
        <button class="opcao-btn" onclick="votar('${o.id}')">
          <span class="emoji">${o.emoji}</span>
          <span class="label">${o.label}</span>
          <span style="color:#aaa">›</span>
        </button>`).join('');
    }
  }

  function renderResultado() {
    const t = total();
    document.getElementById('resultado-card').innerHTML = OPCOES.map((o, i) => `
      <div class="res-row">
        <span class="res-emoji">${o.emoji}</span>
        <div class="res-info">
          <div class="res-nome">${o.label}</div>
          <div class="barra-wrap"><div class="barra ${CORES[i]}" style="width:${pct(o.id)}%"></div></div>
          <div class="res-count">${votos[o.id]} voto${votos[o.id] !== 1 ? 's' : ''}</div>
        </div>
        <span class="res-pct">${pct(o.id)}%</span>
      </div>`).join('');
    document.getElementById('total-badge').innerHTML = `👥 ${t} voto${t !== 1 ? 's' : ''}`;
  }

  function render() { renderHome(); renderVotar(); renderResultado(); }

  /* -------- ação de votar -------- */
  function votar(id) {
    if (getCookie('meu_voto')) { alert('Você já votou!'); return; }
    votos[id] = (votos[id] || 0) + 1;
    setCookie('meu_voto', id);
    render();
    ir('resultado');
  }

  /* -------- navegação -------- */
  function ir(pg) {
    const map = { home: 'pg-home', votar: 'pg-votar', resultado: 'pg-resultado' };
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(map[pg]).classList.add('active');
    const idx = { home: 0, votar: 1, resultado: 2 }[pg];
    document.querySelectorAll('.nav-btn')[idx].classList.add('active');
    render();
  }

  /* -------- init -------- */
  render();
</script>
</body>
</html>
